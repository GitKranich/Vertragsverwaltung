name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          # Beschreibung und Themen des Repos braucht nur die Aufnahme in den HACS-Standard-Store;
          # dieses Repo wird als benutzerdefiniertes Repository installiert.
          ignore: "description topics"

  release-scripts:
    name: Test release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release notes extraction and changelog
        run: .github/scripts/test-release-notes.sh

      - name: Test release planning (stable vs. beta)
        run: .github/scripts/test-release-plan.sh

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check custom_components"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest

  panel-browser:
    name: Panel in the browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright with Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Smoke test of the panel (every tab, states, dialogs)
        run: python tests/frontend/smoke.py
